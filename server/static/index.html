<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font:15px/1.6 system-ui, sans-serif; background:#0a0a0f; color:#f3efe7; }
  main { max-width:560px; padding:24px; }
  code, pre { font-family:ui-monospace, monospace; background:#191921; border-radius:8px; }
  pre { padding:14px 16px; overflow:auto; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:#9b98a5; }
</style>

<body>
<main>
  <h1>Giao diện web chưa được build</h1>
  <p>API vẫn đang chạy. Để dùng website (đăng nhập, biên tập, quản trị), build giao diện React một lần rồi tải lại trang:</p>
  <pre>cd web
npm install
npm run build</pre>
  <p>Khi phát triển giao diện, chạy <code>npm run dev</code> trong thư mục <code>web/</code> và mở http://localhost:5173.</p>
</main>
</body>
